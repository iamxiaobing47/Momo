# Release：push tag 时自动构建并**创建 GitHub Release**（挂上发布包）。
#
# tag 命名：**必须等于 manifest.json 的 version，且不带 v 前缀**（如 `0.9.50`）。
# Obsidian 社区插件商店（以及提交入口）按「release tag == manifest.version」匹配，
# 带 v 前缀会被判成「没有匹配 manifest 版本的 release」而卡住。下面的
# 「Verify tag matches manifest version」一步专门守这条：对不上号直接红，别发错包。
#
# 为什么在 CI 里构建而不是手动传包：上架商店的硬性前提就是每个版本一份可下载的
# 构建产物；手动传包错过 / 传错 / 传的半成品都没有任何机器能拦住。
#
# CI 里没有 MOMO_VAULTS，部署按设计被跳过、build 仍 exit 0——这正是发布包要的
# 「纯净构建」：只产工程根产物，不往任何人的 vault 里写东西。
name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    # 创建 Release 需要写权限；仓库默认 token 权限不足时必须显式声明
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      # tag 必须等于 manifest.json 的 version（Obsidian 商店的匹配口径，不带 v）
      - name: Verify tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag '$tag' 与 manifest.json version '$ver' 不一致——Obsidian 要求 tag 等于版本号（不带 v 前缀）"
            exit 1
          fi
          echo "tag '$tag' == manifest version '$ver' ✓"

      # production 构建（重建 CSS → bundle main.js / globe3d.js → 部署[CI 里跳过] → 自校验）
      - run: npm run build

      # 按 scripts/vault-targets.mjs 的 releaseManifest() 铺平成 vault 插件目录布局
      # （main/manifest/styles/globe3d + fonts/ + 两套贴图六面），缺任何一件即红。
      # 清单只有那一份真源——别在这里手列文件（BUG-117b：手列漏了 globe3d.js 与 12 张
      # 贴图，发出去的包星球档静默退化；守卫 scripts/release-assets-guard.test.mts）
      - run: node scripts/stage-release.mjs "${{ runner.temp }}/momo-release"

      # 先留一份 CI artifact（排障用），再创建正式 Release
      - uses: actions/upload-artifact@v4
        with:
          name: momo-${{ github.ref_name }}
          if-no-files-found: error
          path: ${{ runner.temp }}/momo-release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "${{ runner.temp }}/momo-release"
          # 资产清单的唯一真源是 stage-release / vault-targets.releaseManifest()：
          # 这里用 find 把铺平目录里的每个文件都交给 gh，不在 workflow 里手列文件名
          # （手列会变成第二份真源，正是 BUG-117b 的教训）。
          mapfile -t assets < <(find . -type f -printf '%P\n' | sort)
          echo "release assets:"; printf '  %s\n' "${assets[@]}"
          # `--repo` 是必须的：上面的 cd 已经把 cwd 挪到仓库外，而 gh 在没显式给仓库时
          # 会退回「在当前目录跑 git」去解析仓库、并执行 `git tag --list` 读 tag 注解，
          # 于是必然报 `failed to run git: fatal: not a git repository`——v1.0.0 首发的
          # 真实故障：build / 铺包 / artifact 全绿，只在最后这一步红。给了 --repo 后 gh
          # 走 REST（`--generate-notes` 也变成服务端 generate_release_notes），不再碰 git。
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            "${assets[@]}"
